<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="날아오는 과일을 음악에 맞춰 써는 1인칭 리듬게임">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>케찹이 만들어지는 과정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen first-person canvas; DOM only for the start and result cards. Single committed look (kitchen at night), same in both themes. */
:root{
  --ink:#25140e;
  --cream:#fff6e8;
  --tomato:#e8361f;
  --tomato-deep:#a8160f;
  --leaf:#3f8a2f;
  --tile:#2b6563;
  --font-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --font-score:"Bungee","Black Han Sans",system-ui,sans-serif;
  --font-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--tile);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair}
.overlay{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:16px;background:rgba(18,40,40,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.card{width:min(440px,100%);box-sizing:border-box;background:var(--cream);border:3px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:28px 26px 24px;display:flex;flex-direction:column;gap:14px;text-align:left}
.eyebrow{font-family:var(--font-score);font-size:12px;letter-spacing:.14em;color:var(--tomato-deep)}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(34px,9vw,46px);line-height:1.05;text-wrap:balance}
h1 span{color:var(--tomato)}
.lead{margin:0;font-size:15px;line-height:1.6;color:#4a342b}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.key{font-size:13px;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:5px 10px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.judges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-family:var(--font-score);font-size:11px;text-align:center}
.judges div{border:2px solid var(--ink);border-radius:9px;padding:6px 2px;background:#fff}
.btn{appearance:none;border:3px solid var(--ink);border-radius:14px;background:var(--tomato);color:#fff;font-family:var(--font-display);font-size:22px;padding:12px 18px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:hover{background:#f04529}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid #ffd23f;outline-offset:3px}
.rank-row{display:flex;align-items:center;gap:18px}
.rank{font-family:var(--font-score);font-size:84px;line-height:1;color:var(--tomato);-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink)}
.rank-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.big{font-family:var(--font-score);font-size:30px;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:#6a5146}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{border:2px solid var(--ink);border-radius:10px;padding:8px 2px;background:#fff;display:flex;flex-direction:column;gap:2px}
.stats b{font-family:var(--font-score);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--font-score);font-size:10px;letter-spacing:.05em}
.hint{font-size:12px;color:#7a6055;margin:0}
.card{max-height:calc(100% - 8px);overflow-y:auto}
.songs{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:720px){.card:has(.songs){width:min(660px,100%)}.songs{grid-template-columns:1fr 1fr}}
.song .new{font-family:var(--font-score);font-size:9px;letter-spacing:.06em;color:#fff;background:var(--tomato);border:2px solid var(--ink);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:3px}
.song{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);padding:10px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font:inherit;transition:transform .06s,box-shadow .06s,background .1s}
.song:hover{background:#ffeee4}
.song:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.song:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.song-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.song-main b{font-family:var(--font-display);font-weight:400;font-size:20px}
.song-main small{font-size:12px;color:#6a5146}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:#f1e3d4}
.pips i.on{background:var(--tomato)}
.pips em{font-style:normal;font-size:11px;font-weight:700;border:2px solid var(--ink);border-radius:99px;padding:2px 8px;background:#e6f6ec}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ghost{background:#fff;color:var(--ink)}
.pause-btn{position:fixed;top:calc(env(safe-area-inset-top,0px) + max(14px,3vmin));right:max(14px,3vw);z-index:2;width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:0}
.pause-btn i{display:block;width:6px;height:16px;border-radius:2px;background:var(--ink)}
.pause-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.pause-btn:focus-visible,.opt:focus-visible,.custom-btn:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.pause-title{margin:0;font-family:var(--font-display);font-weight:400;font-size:36px;line-height:1.1}
.pause-actions{display:flex;flex-direction:column;gap:10px}
.custom-btn{appearance:none;display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--ink);border-radius:14px;background:#fff3c4;color:var(--ink);padding:10px 14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font:inherit;text-align:left}
.custom-btn:hover{background:#ffeaa0}
.cb-label{font-family:var(--font-display);font-size:18px}
.cb-val{flex:1;min-width:0;font-size:13px;color:#6a5146;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-arrow{font-size:24px;line-height:1}
.overlay.side{place-items:center start;padding-left:max(16px,4vw);background:rgba(18,40,40,.12);backdrop-filter:none;-webkit-backdrop-filter:none}
.custom-card{width:min(400px,100%);gap:12px}
.opt-group{display:flex;flex-direction:column;gap:6px}
.opt-group h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--tomato-deep)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.opts.bgs{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.opt{appearance:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px 4px 5px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.opt:hover{background:#ffeee4}
.opt[aria-pressed="true"]{background:#ffd9cc;box-shadow:0 0 0 2px var(--tomato),0 2px 0 var(--ink)}
.thumb{width:48px;height:48px}
.thumb.bg{width:100%;height:auto;aspect-ratio:8/5;border-radius:6px;border:1.5px solid var(--ink)}
@media (max-width:720px){.overlay.side{place-items:end center;padding-left:16px}.custom-card{max-height:62%}}
.btn-ghost:hover{background:#ffeee4}
@media (max-width:420px){.card{padding:22px 18px 18px}.rank{font-size:68px}}
</style>

</head>
<body>
<button class="pause-btn" id="pauseBtn" type="button" aria-label="일시정지" hidden><i></i><i></i></button>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <div class="eyebrow">PAUSED · <span id="pSong"></span></div>
    <h2 class="pause-title">일시정지</h2>
    <div class="pause-actions">
      <button class="btn" id="resumeBtn" type="button">계속하기</button>
      <button class="btn btn-ghost" id="restartBtn" type="button">처음부터</button>
      <button class="btn btn-ghost" id="quitBtn" type="button">나가기</button>
    </div>
    <p class="hint">Esc 또는 P 키로도 멈추고 다시 이어서 할 수 있어요.</p>
  </div>
</div>

<div class="overlay side" id="customScreen" hidden>
  <div class="card custom-card">
    <div class="eyebrow">CUSTOMIZE</div>
    <h2 class="pause-title">꾸미기</h2>
    <section class="opt-group"><h3>과일</h3><div class="opts" id="opt-fruit"></div></section>
    <section class="opt-group"><h3>무기</h3><div class="opts" id="opt-weapon"></div></section>
    <section class="opt-group"><h3>배경</h3><div class="opts bgs" id="opt-bg"></div></section>
    <button class="btn" id="customDone" type="button">완료</button>
  </div>
</div>

<canvas id="game" aria-label="토마토 리듬 게임 화면"></canvas>

<div class="overlay" id="startScreen">
  <div class="card">
    <div class="eyebrow">RHYTHM · KITCHEN</div>
    <h1><span>케찹</span>이 만들어지는 과정</h1>
    <p class="lead">날아오는 토마토가 가운데 링에 꼭 맞게 커지는 순간, 음악에 맞춰 칼로 썰어요. 처음이라면 튜토리얼부터 해 보세요.</p>
    <div class="keys"><span class="key">스페이스바</span><span class="key">F · J 키</span><span class="key">클릭</span><span class="key">화면 터치</span></div>
    <button class="custom-btn" id="customBtn" type="button"><span class="cb-label">꾸미기</span><span class="cb-val" id="loadout"></span><span class="cb-arrow" aria-hidden="true">›</span></button>
    <div class="songs" id="songList"></div>
    <p class="hint">소리가 나는 게임이에요. 볼륨을 확인해 주세요.</p>
  </div>
</div>

<div class="overlay" id="resultScreen" hidden>
  <div class="card">
    <div class="eyebrow">RESULT · <span id="rSong"></span></div>
    <div class="rank-row">
      <div class="rank" id="rRank">S</div>
      <div class="rank-meta">
        <div class="big" id="rScore">0</div>
        <div class="small" id="rDetail">정확도 0% · 최대 콤보 0</div>
      </div>
    </div>
    <div class="stats">
      <div><b id="rP">0</b><span style="color:#b88a00">PERFECT</span></div>
      <div><b id="rG">0</b><span style="color:#2f8f36">GREAT</span></div>
      <div><b id="rD">0</b><span style="color:#1f7cb8">GOOD</span></div>
      <div><b id="rM">0</b><span style="color:#7d736d">MISS</span></div>
    </div>
    <div class="btn-row"><button class="btn" id="againBtn" type="button">다시 하기</button><button class="btn btn-ghost" id="menuBtn" type="button">곡 선택</button></div>
  </div>
</div>

<script>
(() => {
const OUT = '#25140e';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W, H, DPR, MIN, R, CX, CY, PX, PY, KL;
let bgCanvas, tomatoSpr, sectionSpr, knifeSpr, TS, SS;

function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h ?? w)); return c; }

/* ---------- sprites ---------- */
function makeTomato(S) {
  const c = mk(S), g = c.getContext('2d');
  const r = S * 0.4;
  g.translate(S / 2, S / 2 + S * 0.03);
  const body = () => {
    g.beginPath();
    for (let i = 0; i <= 160; i++) {
      const a = i / 160 * Math.PI * 2;
      const rr = r * (1 + 0.028 * Math.cos(5 * a + 0.4));
      const x = Math.cos(a) * rr * 1.06, y = Math.sin(a) * rr * 0.93;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.closePath();
  };
  const gr = g.createRadialGradient(-r * .38, -r * .42, r * .04, 0, 0, r * 1.12);
  gr.addColorStop(0, '#ff8a68'); gr.addColorStop(.35, '#f2462a'); gr.addColorStop(.75, '#cf2615'); gr.addColorStop(1, '#93140c');
  body(); g.fillStyle = gr; g.fill();
  g.save(); body(); g.clip();
  // lobes
  g.lineCap = 'round';
  for (const k of [-.62, -.28, .28, .62]) {
    g.beginPath(); g.moveTo(k * r * .25, -r * .78);
    g.quadraticCurveTo(k * r * 1.45, -r * .1, k * r * .9, r * .7);
    g.strokeStyle = 'rgba(110,10,4,.22)'; g.lineWidth = r * .045; g.stroke();
  }
  // bottom shadow + warm rim light
  let sh = g.createLinearGradient(0, -r, 0, r);
  sh.addColorStop(.55, 'rgba(80,0,0,0)'); sh.addColorStop(1, 'rgba(80,0,0,.35)');
  g.fillStyle = sh; g.fillRect(-r * 1.2, -r, r * 2.4, r * 2);
  const rim = g.createRadialGradient(r * .55, r * .55, 0, r * .55, r * .55, r * .55);
  rim.addColorStop(0, 'rgba(255,180,130,.28)'); rim.addColorStop(1, 'rgba(255,180,130,0)');
  g.fillStyle = rim; g.fillRect(-r * 1.2, -r, r * 2.4, r * 2);
  // gloss
  g.fillStyle = 'rgba(255,255,255,.88)';
  g.beginPath(); g.ellipse(-r * .45, -r * .36, r * .24, r * .11, -.65, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(-r * .2, -r * .6, r * .06, r * .04, -.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.25)';
  g.beginPath(); g.ellipse(r * .5, r * .42, r * .16, r * .06, -.9, 0, Math.PI * 2); g.fill();
  // stem dimple
  g.fillStyle = 'rgba(90,10,5,.35)';
  g.beginPath(); g.ellipse(0, -r * .8, r * .32, r * .12, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  body(); g.lineJoin = 'round'; g.lineWidth = r * .075; g.strokeStyle = OUT; g.stroke();
  // calyx (viewed slightly from above)
  const cy0 = -r * .8, n = 5;
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n + .35;
    const a2 = a + Math.PI / n;
    const tx = Math.cos(a) * r * .56, ty = cy0 + Math.sin(a) * r * .24;
    const ix = Math.cos(a2) * r * .13, iy = cy0 + Math.sin(a2) * r * .06;
    const bx = Math.cos(a - .18) * r * .2, by = cy0 + Math.sin(a - .18) * r * .09;
    if (i === 0) g.moveTo(bx, by);
    g.quadraticCurveTo(Math.cos(a - .12) * r * .42, cy0 + Math.sin(a - .12) * r * .2 - r * .03, tx, ty);
    g.quadraticCurveTo(Math.cos(a + .2) * r * .3, cy0 + Math.sin(a + .2) * r * .14, ix, iy);
    const nb = a + Math.PI * 2 / n - .18;
    g.quadraticCurveTo(Math.cos(a2) * r * .2, cy0 + Math.sin(a2) * r * .1, Math.cos(nb) * r * .2, cy0 + Math.sin(nb) * r * .09);
  }
  g.closePath();
  const lg = g.createLinearGradient(0, cy0 - r * .25, 0, cy0 + r * .25);
  lg.addColorStop(0, '#7cc84c'); lg.addColorStop(1, '#2f7a2a');
  g.fillStyle = lg; g.fill();
  g.lineWidth = r * .05; g.strokeStyle = OUT; g.stroke();
  // leaf veins
  g.strokeStyle = 'rgba(25,70,20,.55)'; g.lineWidth = r * .02;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / n + .35;
    g.beginPath(); g.moveTo(Math.cos(a) * r * .1, cy0 + Math.sin(a) * r * .05);
    g.lineTo(Math.cos(a) * r * .4, cy0 + Math.sin(a) * r * .17); g.stroke();
  }
  // stem
  g.beginPath();
  g.moveTo(-r * .055, cy0 - r * .02);
  g.quadraticCurveTo(-r * .07, cy0 - r * .16, -r * .02, cy0 - r * .25);
  g.lineTo(r * .07, cy0 - r * .23);
  g.quadraticCurveTo(r * .03, cy0 - r * .14, r * .06, cy0 - r * .02);
  g.closePath();
  g.fillStyle = '#5a9a35'; g.fill(); g.lineWidth = r * .04; g.stroke();
  g.fillStyle = '#9fd76a'; g.beginPath(); g.ellipse(r * .025, cy0 - r * .24, r * .045, r * .02, -.2, 0, Math.PI * 2); g.fill(); g.stroke();
  return c;
}

function makeSection(S) {
  const c = mk(S), g = c.getContext('2d');
  const r = S * .45; g.translate(S / 2, S / 2);
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fillStyle = '#c92414'; g.fill();
  const pg = g.createRadialGradient(0, 0, r * .1, 0, 0, r * .92);
  pg.addColorStop(0, '#ffb09a'); pg.addColorStop(.6, '#ff6a4c'); pg.addColorStop(1, '#ee4128');
  g.beginPath(); g.arc(0, 0, r * .9, 0, Math.PI * 2); g.fillStyle = pg; g.fill();
  // locules
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    g.save(); g.rotate(a); g.translate(r * .5, 0);
    g.beginPath(); g.ellipse(0, 0, r * .3, r * .24, 0, 0, Math.PI * 2);
    const gg = g.createRadialGradient(-r * .05, 0, 0, 0, 0, r * .3);
    gg.addColorStop(0, '#fbe08a'); gg.addColorStop(.7, '#f2b452'); gg.addColorStop(1, '#e48a3c');
    g.fillStyle = gg; g.fill();
    g.lineWidth = r * .025; g.strokeStyle = '#b8301c'; g.stroke();
    // seeds
    for (let s = 0; s < 5; s++) {
      const sa = s / 5 * Math.PI * 2 + i;
      const sx = Math.cos(sa) * r * .14, sy = Math.sin(sa) * r * .11;
      g.save(); g.translate(sx, sy); g.rotate(sa + Math.PI / 2);
      g.beginPath(); g.ellipse(0, 0, r * .032, r * .052, 0, 0, Math.PI * 2);
      g.fillStyle = '#fff4d2'; g.fill(); g.lineWidth = r * .014; g.strokeStyle = OUT; g.stroke();
      g.restore();
    }
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, r * .17, 0, Math.PI * 2); g.fillStyle = '#ffc0ae'; g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)';
  g.beginPath(); g.ellipse(-r * .4, -r * .55, r * .2, r * .06, -.6, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.lineWidth = r * .07; g.strokeStyle = OUT; g.stroke();
  return c;
}

function makeKnife(L) {
  // toy-like cute knife: chubby rounded blade, pastel capsule handle with a little face
  const w = L * 1.02, h = L * .24;
  const c = mk(w * DPR, h * DPR), g = c.getContext('2d');
  g.scale(DPR, DPR); g.translate(0, h / 2);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const lw = Math.max(2, L * .011);
  // blade: soft rounded paddle
  const bx0 = L * .34, bx1 = L * .8, bt = -L * .075, bb = L * .05, br = (bb - bt) / 2, bc = (bb + bt) / 2;
  const blade = () => {
    g.beginPath();
    g.moveTo(bx0, bb);
    g.lineTo(bx1, bb);
    g.arc(bx1, bc, br, Math.PI / 2, -Math.PI / 2, true);
    g.quadraticCurveTo(L * .55, bt - L * .006, bx0, bt + L * .012);
    g.closePath();
  };
  blade();
  const bg = g.createLinearGradient(0, bt, 0, bb);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(.35, '#e4f1fb'); bg.addColorStop(1, '#a9c6dc');
  g.fillStyle = bg; g.fill();
  g.save(); blade(); g.clip();
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.beginPath(); g.roundRect(L * .4, bt + L * .02, L * .3, L * .018, 99); g.fill();
  g.beginPath(); g.arc(L * .73, bt + L * .029, L * .009, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(90,130,170,.22)'; g.fillRect(bx0, bb - L * .02, bx1 - bx0 + br, L * .02);
  g.restore();
  blade(); g.lineWidth = lw; g.strokeStyle = OUT; g.stroke();
  // sparkle on blade

function drawKitchen(g, W, H, CX, MIN) {

  const corner = MIN * .03;
  const board = () => {
    g.beginPath();
    g.moveTo(CX - hwB, bot);
    g.lineTo(CX - hwT, top + corner);
    g.quadraticCurveTo(CX - hwT, top, CX - hwT + corner, top);
    g.lineTo(CX + hwT - corner, top);
    g.quadraticCurveTo(CX + hwT, top, CX + hwT, top + corner);
    g.lineTo(CX + hwB, bot);
    g.closePath();

  board();

  wg.addColorStop(0, '#c98b4f'); wg.addColorStop(1, '#e0a868');
  g.fillStyle = wg; g.fill();
  g.save(); board(); g.clip();
  for (let i = 0; i <= 22; i++) {
    const f = i / 22, xt = CX - hwT + f * hwT * 2, xb = CX - hwB + f * hwB * 2;
    g.beginPath(); g.moveTo(xt, top);
    const wob = (rnd() - .5) * MIN * .03;
    g.bezierCurveTo(xt + wob, top + (bot - top) * .3, xb - wob, top + (bot - top) * .7, xb, bot);
    g.strokeStyle = i % 3 ? 'rgba(130,70,30,.18)' : 'rgba(110,55,20,.3)';
    g.lineWidth = 1 + f * 0 + (i % 3 ? .6 : 1.4); g.stroke();
  }
  for (let k = 0; k < 2; k++) {
    const kx = CX + (k ? .45 : -.55) * hwT * 1.3, ky = top + (bot - top) * (k ? .55 : .35);

  g.lineTo(CX - hwT + inT, top + inT * 1.4);
  g.lineTo(CX + hwT - inT, top + inT * 1.4);
  g.lineTo(CX + hwB - inT * 3, bot);
  g.strokeStyle = 'rgba(100,50,15,.35)'; g.lineWidth = MIN * .008; g.stroke();
  g.strokeStyle = 'rgba(255,220,170,.35)'; g.lineWidth = MIN * .003;
  g.save(); g.translate(0, MIN * .005); g.stroke(); g.restore();

  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,20,20,.45)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midi(name) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(name);
  return 12 * (+m[3] + 1) + NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
function parseMel(str) {
  const tok = str.trim().split(/\s+/);

  const out = [];
  tok.forEach((x, i) => { if (x !== '.' && x !== '-') out.push({ step: i, m: midi(x) }); });
  out.forEach((n, i) => n.len = Math.min(16, (out[i + 1] ? out[i + 1].step : 16) - n.step));

let mode = 'tutorial';

function buildChart() {
  bars = []; notes = []; sectionStarts = [];

    notes.push({
      t: time, travel, judged: false, gone: false,
      x0: side * (3.5 + Math.random() * 3), y0: 3.2 + Math.random() * 1.6, arc: 2.4 + Math.random() * 1.4,
      rot0: side * (.5 + Math.random() * .4), spin: -side * (.5 + Math.random() * .5),
    });
  };
  if (mode === 'tutorial') {
    const addBar = (bpm, kind, sec, pat, travel) => {
      const beat = 60 / bpm;
      bars.push({ t, bpm, beat, kind, sec, idx: bars.length });
      if (pat) for (const b of pat) addNote(t + b * beat, travel);
      t += beat * 4;
    };
    addBar(SECTIONS[0].bpm, 'count', 0);
    SECTIONS.forEach((s, si) => {
      sectionStarts.push({ t, name: s.name, label: s.label, bpm: s.bpm });
      for (let b = 0; b < 4; b++) addBar(s.bpm, 'play', si, s.pats[b], s.travel);
    });
    addBar(SECTIONS[5].bpm, 'final', 5, [0], 1.25);

    const beat = 60 / song.bpm, step = beat / 4;

let schedBar = 0, t0 = 0;

    const prog = PROG[bar.idx % 4];

    } else if (bar.kind === 'song' || bar.kind === 'send') {

/* ---------- game state ---------- */

}

function notePos(n, t) {
  const p = (t - (n.t - n.travel)) / n.travel;
  const z = 7 - 6 * p;
  const X = n.x0 * (1 - p);
  const Y = n.y0 * (1 - p) + n.arc * 4 * p * (1 - p);

function press() {
  if (state !== 'play') return;
  const now = performance.now() / 1000;
  swingStart = now;
  const t = songNow();
  let hit = null;
  for (const n of notes) {
    if (n.judged) continue;
    const d = t - n.t;
    if (d < -WIN.good) break;
    if (Math.abs(d) <= WIN.good) { hit = n; break; }
  }
  if (!hit) { swishSound(); return; }
  const d = t - hit.t, ad = Math.abs(d);
  const grade = ad <= WIN.perfect ? 'PERFECT' : ad <= WIN.great ? 'GREAT' : 'GOOD';
  hit.judged = true; hit.gone = true;
  counts[grade]++;
  combo++; maxCombo = Math.max(maxCombo, combo);
  const mult = 1 + Math.min(10, Math.floor(combo / 10)) * .1;
  score += Math.round({ PERFECT: 300, GREAT: 200, GOOD: 100 }[grade] * mult);
  popups.push({ text: grade, sub: grade === 'PERFECT' ? '' : (d < 0 ? 'FAST' : 'SLOW'), t: now });
  sliceSound(grade);
  const pos = notePos(hit, t);
  spawnSlice(Math.min(Math.max(pos.x, 0), W), pos.y, Math.min(pos.r, R * 1.6), pos.rot, grade);
  if (grade === 'PERFECT' && !reduceMotion) shake = Math.max(shake, R * .08);
}

function judgeMiss(n) {
  n.judged = true;
  counts.MISS++; combo = 0;
  popups.push({ text: 'MISS', sub: '', t: performance.now() / 1000 });
  missSound();
}

  const nx = -Math.sin(cutAng), ny = Math.cos(cutAng);

  for (const side of [-1, 1]) {

      vr: side * (2.5 + Math.random() * 2), life: 0,

    parts.push({ kind: Math.random() < .3 ? 'seed' : 'drop', x, y, vx: Math.cos(a) * sp, vy: Math.abs(Math.sin(a)) * sp * .6 + R, s: R * (.04 + Math.random() * .05), life: 0, max: .3 + Math.random() * .25, rot: Math.random() * 6 });

/* ---------- render ---------- */
let lastFrame = performance.now() / 1000;
function frame() {

    t = songNow();

      if (n.t > t) break;
      if (!n.judged && t - n.t > WIN.good) judgeMiss(n);
    }
    let si = -1;
    sectionStarts.forEach((s, i) => { if (s.t <= t + .05) si = i; });
    if (si >= 0 && si !== curSection) {
      curSection = si;
      banner = { t: now, s: sectionStarts[si] };

  } else if (state === 'paused') t = songNow();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  ctx.drawImage(bgCanvas, 0, 0, W, H);
  ctx.translate(sx, sy);

  // stains
  for (const s of splats) {
    s.life += dt;
    const a = Math.max(0, .55 - s.life / 10);
    if (a <= 0) continue;
    ctx.fillStyle = `rgba(${FRUIT_FX[cfg.fruit].stain},${a})`;
    ctx.beginPath();
    s.pts.forEach((m, i) => {
      const ang = i / s.pts.length * Math.PI * 2;
      const px = s.x + Math.cos(ang) * s.r * m * 1.4, py = s.y + Math.sin(ang) * s.r * m * .55;

    ctx.lineJoin = 'round';
    ctx.lineWidth = fs * .22; ctx.strokeStyle = OUT;
    ctx.strokeText(last.text, 0, fs * .08);
    ctx.strokeText(last.text, 0, 0);
    ctx.fillStyle = OUT; ctx.fillText(last.text, 0, fs * .1);
    ctx.fillStyle = COLORS[last.text]; ctx.fillText(last.text, 0, 0);
    if (last.sub) {
      const f2 = Math.round(fs * .34);
      ctx.font = `${f2}px Bungee, sans-serif`;
      ctx.lineWidth = f2 * .3; ctx.strokeText(last.sub, 0, fs * .78);
      ctx.fillStyle = last.sub === 'FAST' ? '#9fd8ff' : '#ffb38a'; ctx.fillText(last.sub, 0, fs * .78);
    }
    ctx.restore();
  }

  if (state === 'play' || state === 'paused') drawHUD(t, now);
  requestAnimationFrame(frame);
}

function outlinedText(txt, x, y, size, fill, font, align = 'left') {
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * .2; ctx.strokeStyle = OUT; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

function drawHUD(t, now) {
  const pad = Math.max(16, W * .03);
  const fsS = Math.max(12, Math.round(MIN * .028));
  const fsL = Math.max(20, Math.round(MIN * .055));
  const top = pad + fsL;
  outlinedText('SCORE', pad, pad + fsS * .4, fsS, '#ffd8b0', 'Bungee, sans-serif');
  outlinedText(score.toLocaleString(), pad, top + fsS * .9, fsL, '#fff6e8', 'Bungee, sans-serif');
  const total = notes.length;
  const judged = counts.PERFECT + counts.GREAT + counts.GOOD + counts.MISS;
  const acc = judged ? (counts.PERFECT + counts.GREAT * .7 + counts.GOOD * .4) / judged * 100 : 100;
  const rx = W - pad - Math.max(44, MIN * .07);
  outlinedText(`${acc.toFixed(1)}%`, rx, pad + fsS * .4, fsS, '#ffd8b0', 'Bungee, sans-serif', 'right');
  if (combo >= 2) {
    outlinedText(`${combo}`, rx, top + fsS * .9, fsL, combo >= 30 ? '#ffd23f' : '#fff6e8', 'Bungee, sans-serif', 'right');
    outlinedText('COMBO', rx, top + fsS * .9 + fsS * 1.3, fsS, '#ffd8b0', 'Bungee, sans-serif', 'right');
  }
  // progress
  const bw = Math.min(W - pad * 2 - fsL * 6, MIN * .5), bx = CX - bw / 2, by = pad;
  const prog = Math.max(0, Math.min(1, t / songEnd));
  ctx.lineWidth = 2; ctx.strokeStyle = OUT;
  ctx.fillStyle = 'rgba(20,40,40,.6)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, MIN * .016, 99); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8361f';
  ctx.beginPath(); ctx.roundRect(bx, by, Math.max(MIN * .016, bw * prog), MIN * .016, 99); ctx.fill(); ctx.stroke();
  for (const s of sectionStarts) {
    const mx = bx + bw * (s.t / songEnd);
    ctx.fillStyle = OUT; ctx.fillRect(mx - 1, by - 3, 2, MIN * .016 + 6);
  }
  if (curSection >= 0) {
    const s = sectionStarts[curSection];
    outlinedText(`${s.name} · ${s.bpm} BPM`, CX, by + MIN * .016 + fsS * 1.6, fsS, '#fff6e8', '"Black Han Sans", sans-serif', 'center');
  }
  // count-in
  if (t < bars[1].t) {
    const b = bars[0];
    const i = Math.floor((t - b.t) / b.beat);
    if (i >= 0 && i < 4) {
      const ph = ((t - b.t) / b.beat) % 1;
      const txt = ['준비', '3', '2', '1'][i];
      ctx.save(); ctx.globalAlpha = 1 - ph * .7;
      outlinedText(txt, CX, CY - R * 1.9, Math.round(R * (.8 - ph * .15)), '#fff6e8', '"Black Han Sans", Bungee, sans-serif', 'center');
      ctx.restore();
    }
  }
  // section banner
  if (banner) {
    const age = now - banner.t;
    if (age > 2) banner = null;
    else {
      const a = age < .2 ? age / .2 : age > 1.5 ? 1 - (age - 1.5) / .5 : 1;
      const fsB = Math.max(18, Math.round(MIN * .045));
      const subFs = Math.max(11, Math.round(fsB * .45));
      const sub = `${banner.s.label} · ♩=${banner.s.bpm}`;
      ctx.font = `${subFs}px "Black Han Sans", "Noto Sans KR", sans-serif`;
      const boxW = Math.max(ctx.measureText(sub).width, fsB * 3.2) + fsB * .9;
      const boxH = fsB + subFs + fsB * .8;
      const slide = age < .2 ? -(1 - age / .2) * (boxW + pad) : 0;
      const bx0 = pad + slide, by0 = top + fsS * 2.2;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(37,20,14,.8)'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(bx0, by0, boxW, boxH, fsB * .3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffd23f'; ctx.fillRect(bx0, by0 + fsB * .3, 4, boxH - fsB * .6);
      outlinedText(banner.s.name, bx0 + fsB * .45, by0 + fsB * 1.15, fsB, '#ffd23f', '"Black Han Sans", sans-serif');
      outlinedText(sub, bx0 + fsB * .45, by0 + fsB * 1.25 + subFs * 1.05, subFs, '#fff6e8', '"Black Han Sans", "Noto Sans KR", sans-serif');
      ctx.restore();
    }
  }
}

/* ---------- input ---------- */
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (state === 'play') { e.preventDefault(); pauseGame(); return; }
    if (state === 'paused') { e.preventDefault(); resumeGame(); return; }
    if (!$('customScreen').hidden) { closeCustom(); return; }
  }
  if (state === 'play' && ['Space', 'KeyF', 'KeyJ', 'KeyK', 'KeyD', 'Enter'].includes(e.code)) { e.preventDefault(); press(); }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
const list = document.getElementById('songList');
const entries = [{ id: 'tutorial', title: '튜토리얼', sub: '6단계로 박자 익히기', diff: 0, bpm: '84–104' }, ...SONGS];
entries.forEach(e => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'song'; b.id = 'song-' + e.id;
  const pips = e.diff ? Array.from({ length: 3 }, (_, i) => `<i class="${i < e.diff ? 'on' : ''}"></i>`).join('') : '<em>연습</em>';
  b.innerHTML = `<span class="song-main"><b>${e.title}${e.isNew ? '<span class="new">NEW</span>' : ''}</b><small>${e.sub} · ${e.bpm} BPM</small></span><span class="pips" aria-label="난이도 ${e.diff || '연습'}">${pips}</span>`;
  b.addEventListener('click', () => startGame(e.id));
  list.appendChild(b);
});
document.getElementById('againBtn').addEventListener('click', () => startGame(mode));
$('menuBtn').addEventListener('click', toMenu);
$('pauseBtn').addEventListener('click', pauseGame);
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', () => startGame(mode));
$('quitBtn').addEventListener('click', toMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* customize screen */
const LABEL = { fruit: '과일', weapon: '무기', bg: '배경' };
function thumbFor(kind, id) {
  if (kind === 'bg') { const c = renderBg(id, 120, 75, 2); c.className = 'thumb bg'; return c; }
  const c = mk(112), g = c.getContext('2d'); c.className = 'thumb';
  if (kind === 'fruit') g.drawImage(FRUITS[id].whole(112), 0, 0);
  else {
    const L = 140, spr = WEAPONS[id](L);
    g.translate(10, 102); g.rotate(-Math.PI / 4); g.drawImage(spr, -4, -L * .12, L * 1.02, L * .24);
  }
  return c;
}
function updateLoadout() {
  const nm = k => OPTIONS[k].find(o => o.id === cfg[k]).name;
  $('loadout').textContent = `${nm('fruit')} · ${nm('weapon')} · ${nm('bg')}`;
}
function openCustom() {
  $('startScreen').hidden = true; $('customScreen').hidden = false;
  $('opt-fruit').querySelector('[aria-pressed="true"]')?.focus();
}
function closeCustom() { $('customScreen').hidden = true; $('startScreen').hidden = false; $('customBtn').focus(); }
function buildCustom() {
for (const kind of ['fruit', 'weapon', 'bg']) {
  const wrap = $('opt-' + kind);
  for (const o of OPTIONS[kind]) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.id = `opt-${kind}-${o.id}`;
    b.setAttribute('aria-pressed', String(cfg[kind] === o.id));
    b.appendChild(thumbFor(kind, o.id));
    const sp = document.createElement('span'); sp.textContent = o.name; b.appendChild(sp);
    b.addEventListener('click', () => {
      cfg[kind] = o.id; saveCfg(); applyCfg(); updateLoadout();
      wrap.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    });
    wrap.appendChild(b);
  }
}
}
$('customBtn').addEventListener('click', openCustom);
$('customDone').addEventListener('click', closeCustom);
updateLoadout();

window.addEventListener('resize', resize);
resize();
buildCustom();
resetGame();
Promise.all([
  document.fonts?.load('40px Bungee'), document.fonts?.load('40px "Black Han Sans"'),
].filter(Boolean)).catch(() => {});
document.fonts?.ready?.then(() => buildBg());
requestAnimationFrame(frame);
$('song-tutorial').focus();
})();
</script>
